name: admin-web

on:
  push:
    branches: [main]
    paths:
      - 'admin/web/**'
      - '.github/workflows/admin-web.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'admin/web/**'
      - '.github/workflows/admin-web.yml'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  admin-web:
    name: admin web unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
