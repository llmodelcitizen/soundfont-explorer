name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: catalog tests
        if: hashFiles('catalog/tests/**') != ''
        run: python3 -m unittest discover -s catalog/tests -t . -v
      - name: songs tools tests
        if: hashFiles('songs/tools/tests/**') != ''
        run: python3 -m unittest discover -s songs/tools/tests -t . -v
      - name: sfr tests
        if: hashFiles('render/sfr/tests/**') != ''
        run: python3 -m unittest discover -s render/sfr/tests -t render -v
      - name: de-risking script tests
        if: hashFiles('render/scripts/derisk/tests/**') != ''
        run: python3 -m unittest discover -s render/scripts/derisk/tests -t render/scripts/derisk -v
      - name: proto pack tests
        if: hashFiles('web/test/proto/test_mkpack.py') != ''
        run: python3 -m unittest discover -s web/test/proto -p 'test_*.py' -v

  web:
    name: web unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test -- --run
      - run: npm run build --if-present

  lint:
    name: shellcheck + hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          mapfile -t files < <( { git ls-files '*.sh'; git ls-files render/scripts/sfr web/scripts | xargs -r grep -lE '^#!/(usr/)?bin/(ba)?sh' ; } | grep -v legacy/ | sort -u || true)
          if [ "${#files[@]}" -gt 0 ]; then shellcheck "${files[@]}"; else echo "no shell scripts"; fi
      - name: hadolint
        if: hashFiles('render/Dockerfile') != ''
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: render/Dockerfile
          ignore: DL3008,DL3003,DL3013,DL3006

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - run: terraform fmt -check -recursive infra
      - name: validate every root
        run: |
          for d in infra/bootstrap infra/live; do
            [ -d "$d" ] || continue
            echo "== $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
